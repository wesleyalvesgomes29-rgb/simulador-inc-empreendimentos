<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#262626"/><stop offset=".55" stop-color="#111318"/><stop offset="1" stop-color="#050608"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9a18"/><stop offset=".55" stop-color="#ff6500"/><stop offset="1" stop-color="#e94700"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="13"/></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="8" y="8" width="496" height="496" rx="92" fill="url(#bg)"/>
<rect x="15" y="15" width="482" height="482" rx="86" fill="none" stroke="#ff6500" stroke-width="12" opacity=".9"/>
<rect x="18" y="18" width="476" height="476" rx="84" fill="#ff6500" opacity=".18" filter="url(#glow)"/>
