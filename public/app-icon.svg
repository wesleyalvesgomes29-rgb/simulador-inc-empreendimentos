 <rect x="145" y="260" width="178" height="216" rx="28" fill="#f5f5f5"/>
 <rect x="164" y="278" width="140" height="39" rx="10" fill="#25272c"/>
 <g fill="#25272c">
  <rect x="166" y="337" width="36" height="30" rx="8"/><rect x="213" y="337" width="36" height="30" rx="8"/><rect x="260" y="337" width="36" height="30" rx="8"/>
  <rect x="166" y="378" width="36" height="30" rx="8"/><rect x="213" y="378" width="36" height="30" rx="8"/><rect x="260" y="378" width="36" height="70" rx="8"/>
  <rect x="166" y="419" width="36" height="30" rx="8"/><rect x="213" y="419" width="36" height="30" rx="8"/>
 </g>
 <rect x="260" y="378" width="36" height="70" rx="8" fill="url(#orange)"/>
</g>
</svg>